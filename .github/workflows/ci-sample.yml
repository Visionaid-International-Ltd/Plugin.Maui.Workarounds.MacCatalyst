name: Build Sample App for CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [ "main" ]

env:
  DOTNET_VERSION: '10.0.x' # The .NET SDK version to use

jobs:
  build-sample-ci:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install .NET MAUI Workload
      run: dotnet workload restore samples\Plugin.Maui.Workarounds.MacCatalyst.Sample.slnx

    - name: Build
      run: dotnet build samples\Plugin.Maui.Workarounds.MacCatalyst.Sample.slnx -c Release
